<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticketing</title>
<style>
  :root {
    --bg: #ffffff; --soft: #f5f6f7; --text: #1b1d1f; --muted: #6b7076; --line: #e4e6e8;
    --brand: #0f9d58; --brand-dark: #0b7d46; --brand-soft: #e6f6ee; --brand-text: #ffffff;
    --bad: #e5484d; --warn: #e08a1e; --shadow: 0 6px 20px rgba(20, 30, 25, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131515; --soft: #1b1e1e; --text: #eef0f0; --muted: #9aa0a4; --line: #2c3030;
            --brand: #2fbf78; --brand-dark: #52d391; --brand-soft: #173126; --brand-text: #0c1a13;
            --bad: #f2777b; --warn: #f0a94a; --shadow: 0 6px 20px rgba(0, 0, 0, .4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 13px; }

  /* top utility bar */
  .util { background: var(--soft); border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .util .wrap { display: flex; justify-content: flex-end; align-items: center; gap: 14px; height: 34px; color: var(--muted); }
  .util button { all: unset; cursor: pointer; }
  .util button:hover { color: var(--brand); }

  /* header */
  header { background: var(--bg); }
  header .wrap { display: flex; align-items: center; gap: 28px; height: 74px; }
  .logo { font-size: 24px; font-weight: 900; letter-spacing: -.02em; color: var(--brand); white-space: nowrap; }
  .logo span { color: var(--text); }
  .search { flex: 1; max-width: 480px; display: flex; border: 2px solid var(--brand); border-radius: 999px; overflow: hidden; background: var(--bg); }
  .search input { flex: 1; border: 0; padding: 10px 18px; font: inherit; background: transparent; color: var(--text); min-width: 0; }
  .search input:focus { outline: none; }
  .search button { border: 0; background: var(--brand); color: var(--brand-text); padding: 0 22px; font-weight: 700; cursor: pointer; font: inherit; font-weight: 700; }

  /* nav */
  .gnb { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 20; }
  .gnb .wrap { display: flex; gap: 6px; overflow-x: auto; }
  .gnb a { padding: 14px 16px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; }
  .gnb a:hover { color: var(--text); }
  .gnb a.on { color: var(--brand); border-bottom-color: var(--brand); }

  /* banner */
  .banner { position: relative; margin-top: 22px; border-radius: 16px; overflow: hidden; height: 300px; background: var(--soft); }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; color: #fff;
           opacity: 0; transition: opacity .6s; pointer-events: none; }
  .slide.on { opacity: 1; pointer-events: auto; }
  .slide h2 { margin: 6px 0 10px; font-size: clamp(24px, 4vw, 38px); line-height: 1.2; letter-spacing: -.02em; max-width: 520px; }
  .slide .kicker { font-size: 13px; font-weight: 700; opacity: .9; letter-spacing: .06em; }
  .slide .meta { opacity: .92; margin-bottom: 20px; }
  .slide .emoji { font-size: clamp(80px, 14vw, 150px); filter: drop-shadow(0 10px 24px rgba(0,0,0,.3)); }
  .slide button { background: #fff; color: #0b3d25; border: 0; padding: 11px 22px; border-radius: 999px; font: inherit; font-weight: 800; cursor: pointer; }
  .dots { position: absolute; left: 56px; bottom: 18px; display: flex; gap: 8px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.5); cursor: pointer; }
  .dots i.on { width: 24px; border-radius: 999px; background: #fff; }

  /* section */
  .sec-head { display: flex; justify-content: space-between; align-items: end; margin: 40px 0 16px; }
  .sec-head h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .count { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 24px 18px; }
  .card { cursor: pointer; }
  .poster { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; color: #fff; padding: 16px;
            display: flex; flex-direction: column; justify-content: flex-end; box-shadow: var(--shadow); transition: transform .18s; }
  .card:hover .poster { transform: translateY(-4px); }
  .poster .emoji { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); font-size: 68px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.3)); }
  .poster .pt { position: relative; font-weight: 800; font-size: 16px; line-height: 1.3; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .badge { position: absolute; top: 10px; left: 10px; font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 6px; color: #fff; }
  .badge.open { background: var(--brand); } .badge.soon { background: var(--warn); } .badge.sold { background: var(--bad); } .badge.none { background: #7a8086; }
  .card .info { padding: 10px 2px 0; }
  .card .t { font-weight: 700; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .v { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; background: var(--soft); border-radius: 12px; }

  /* buttons / inputs */
  button { font: inherit; }
  .btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; font-weight: 700; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-text); }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  input, select { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* my reservations */
  table { width: 100%; border-collapse: collapse; font-size: 14px; border-top: 2px solid var(--text); }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); }
  th { background: var(--soft); font-size: 13px; color: var(--muted); }
  .st-CONFIRMED { color: var(--brand); font-weight: 800; } .st-CANCELED { color: var(--muted); }

  /* admin */
  details.admin { margin-top: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
  details.admin summary { cursor: pointer; font-weight: 800; }
  .admin .row { margin-top: 12px; } .admin label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }

  /* dialogs */
  dialog { border: 0; border-radius: 16px; padding: 0; background: var(--bg); color: var(--text); box-shadow: 0 24px 70px rgba(0,0,0,.35); max-width: 94vw; }
  dialog::backdrop { background: rgba(10, 14, 12, .55); }
  #authDialog { width: 380px; padding: 26px; }
  #authDialog h3 { margin: 0 0 14px; font-size: 20px; }
  #authDialog form { display: grid; gap: 10px; }
  .tabs { display: flex; margin-bottom: 14px; border-bottom: 2px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; padding: 10px; font-weight: 800; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }
  #detailDialog { width: 760px; }
  .dhead { display: flex; gap: 22px; padding: 24px; }
  .dposter { flex: 0 0 200px; aspect-ratio: 3 / 4; border-radius: 12px; color: #fff; display: grid; place-items: center; font-size: 80px; box-shadow: var(--shadow); }
  .dinfo h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .dinfo dl { margin: 14px 0 0; display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; font-size: 14px; }
  .dinfo dt { color: var(--muted); } .dinfo dd { margin: 0; }
  .dsched { padding: 0 24px 24px; }
  .dsched h3 { font-size: 16px; margin: 0 0 10px; }
  .sch { display: grid; grid-template-columns: 1fr 160px auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .sch .d { font-weight: 800; }
  .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 4px; }
  .bar i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .4s; }
  .bar i.low { background: var(--warn); } .bar i.out { background: var(--bad); }
  .dclose { position: absolute; right: 14px; top: 10px; background: none; border: 0; font-size: 26px; cursor: pointer; color: var(--muted); }
  @media (max-width: 640px) {
    .banner { height: 240px; } .slide { padding: 0 24px; } .dots { left: 24px; } .slide .emoji { display: none; }
    header .wrap { gap: 12px; } .logo { font-size: 20px; }
    .dhead { flex-direction: column; } .dposter { flex-basis: auto; width: 150px; font-size: 60px; }
    .sch { grid-template-columns: 1fr auto; } .sch .bwrap { grid-column: 1 / -1; order: 3; }
  }

  /* admin dashboard / management */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; } .kpi .l { color: var(--muted); font-size: 13px; }
  .kpi .v.g { color: var(--brand); }
  .stat-row { display: grid; grid-template-columns: 1fr 220px 90px; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .stat-row .nm { font-weight: 700; } .stat-row .sub { color: var(--muted); font-size: 12.5px; }
  .stat-row .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .mrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
  .msub { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 0 6px 16px; font-size: 13px; color: var(--muted); }
  .msub input { padding: 6px 8px; font-size: 13px; }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  #editDialog { width: 420px; padding: 22px; } #editDialog form { display: grid; gap: 10px; } #editDialog h3 { margin: 0 0 12px; }
  @media (max-width: 640px) { .stat-row { grid-template-columns: 1fr; } .stat-row .num { text-align: left; } }

  /* notifications */
  .nbadge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--bad); color: #fff;
            font-size: 11px; font-weight: 800; text-align: center; line-height: 18px; }
  #notiDialog { width: 440px; padding: 22px; }
  #notiDialog h3 { margin: 0; font-size: 18px; }
  .noti { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .noti.unread::before { content: ''; flex: 0 0 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--brand); }
  .noti .m { flex: 1; font-size: 14px; } .noti .t { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* demo */
  .demo-box { border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .demo-box label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .res { display: grid; grid-template-columns: 110px 1fr 150px; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .res:first-of-type { margin-top: 16px; }
  .res .nm { font-weight: 800; }
  .track { position: relative; height: 22px; background: var(--soft); border-radius: 6px; }
  .track .fill { height: 100%; border-radius: 6px; background: var(--brand); transition: width .5s; }
  .track .fill.bad { background: var(--bad); }
  .track .limit { position: absolute; top: -5px; bottom: -5px; border-left: 2px dashed var(--muted); }
  .res .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .verdict { font-weight: 800; text-align: right; } .verdict.ok { color: var(--brand); } .verdict.bad { color: var(--bad); }
  @media (max-width: 640px) { .res { grid-template-columns: 1fr; } .verdict { text-align: left; } }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); max-width: 90vw; padding: 12px 18px; border-radius: 10px;
           background: var(--text); color: var(--bg); opacity: 0; pointer-events: none; transition: all .22s; font-weight: 700; z-index: 99; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); } #toast.err { background: var(--bad); color: #fff; }
  footer { margin-top: 60px; padding: 28px 0 36px; background: var(--soft); color: var(--muted); font-size: 12.5px; text-align: center; }
</style>
</head>
<body>
<div class="util"><div class="wrap" id="userbox"></div></div>

<header>
  <div class="wrap">
    <a class="logo" href="/">TICKET<span>ING</span></a>
    <div class="search">
      <input id="keyword" placeholder="공연명을 검색하세요">
      <button id="btnSearch">검색</button>
    </div>
  </div>
</header>

<div class="gnb">
  <div class="wrap">
    <a data-filter="all" class="on">전체</a>
    <a data-filter="open">예매 중</a>
    <a data-filter="soon">오픈 예정</a>
    <a data-filter="sold">매진</a>
    <a id="navMy" class="hidden">내 예매</a>
    <a id="navAdmin" class="hidden">관리자 대시보드</a>
    <a id="navDemo" class="hidden">동시성 시연</a>
  </div>
</div>

<main class="wrap">
  <section class="banner" id="banner"></section>

  <div class="sec-head"><h2 id="listTitle">전체 공연</h2><span class="count" id="listCount"></span></div>
  <div id="performances" class="grid"></div>

  <section id="myCard" class="hidden">
    <div class="sec-head"><h2>내 예매 내역</h2></div>
    <div id="myReservations"></div>
  </section>

  <section id="statsCard" class="hidden">
    <div class="sec-head"><h2>관리자 대시보드</h2><span class="count">판매 현황</span></div>
    <div class="kpis" id="kpis"></div>
    <div id="statRows" style="margin-top:14px"></div>
  </section>

  <details class="admin hidden" id="adminCard">
    <summary>관리자 · 공연과 회차 등록 / 관리</summary>
    <div class="row">
      <input id="pTitle" placeholder="공연 제목">
      <input id="pVenue" placeholder="공연장">
      <input id="pDesc" placeholder="설명" style="flex:1; min-width:180px">
      <button class="btn primary" id="btnAddPerf">공연 등록</button>
    </div>
    <div class="row">
      <label>공연<select id="sPerf"></select></label>
      <label>공연 시작<input id="sStart" type="datetime-local"></label>
      <label>티켓 오픈<input id="sOpen" type="datetime-local"></label>
      <label>재고<input id="sStock" type="number" min="1" value="10" style="width:90px"></label>
      <button class="btn primary" id="btnAddSched" style="align-self:end">회차 등록</button>
    </div>
    <p class="muted">티켓 오픈 시각이 현재보다 과거여야 바로 예매할 수 있습니다.</p>
    <h3 style="margin:22px 0 4px; font-size:16px">공연 관리</h3>
    <div id="mgmt"></div>
  </details>

  <section id="demoCard" class="hidden">
    <div class="sec-head"><h2>동시성 시연</h2><span class="count">관리자 전용</span></div>
    <div class="demo-box">
      <p class="muted" style="margin-top:0">재고가 <b>N</b>장인 회차에 <b>M</b>명이 동시에 예매를 시도합니다. 같은 조건으로 방식별 정합성을 비교하며, 임시 공연은 실행 후 삭제됩니다.</p>
      <div class="row">
        <label>재고(장)<input id="dStock" type="number" min="1" max="1000" value="100" style="width:100px"></label>
        <label>동시 요청(명)<input id="dReq" type="number" min="1" max="2000" value="1000" style="width:110px"></label>
        <button class="btn primary" id="btnDemo" style="align-self:end">세 방식 모두 실행</button>
      </div>
      <div id="demoResults"></div>
    </div>
  </section>
</main>

<footer>Ticketing · 선착순 티켓 예매 서비스 (Spring Boot 동시성 포트폴리오)</footer>

<dialog id="detailDialog"><button class="dclose" id="detailClose" aria-label="닫기">×</button><div id="detailBody"></div></dialog>
<dialog id="authDialog">
  <div class="tabs"><button id="tabLogin" class="on" type="button">로그인</button><button id="tabSignup" type="button">회원가입</button></div>
  <form id="authForm" method="dialog">
    <input id="email" type="email" placeholder="이메일" autocomplete="username" required>
    <input id="password" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" required>
    <input id="name" placeholder="이름" class="hidden">
    <button class="btn primary" id="authSubmit" type="submit">로그인</button>
    <button class="btn" type="button" id="authCancel">닫기</button>
  </form>
</dialog>
<dialog id="editDialog">
  <h3>공연 수정</h3>
  <form id="editForm" method="dialog">
    <input id="eTitle" placeholder="공연 제목" required>
    <input id="eVenue" placeholder="공연장" required>
    <input id="eDesc" placeholder="설명">
    <button class="btn primary" type="submit">저장</button>
    <button class="btn" type="button" id="editCancel">닫기</button>
  </form>
</dialog>
<dialog id="notiDialog">
  <div class="row" style="justify-content:space-between; margin-bottom:6px">
    <h3>알림</h3><div class="row"><button class="btn" id="btnReadAll">모두 읽음</button><button class="btn" id="notiClose">닫기</button></div>
  </div>
  <div id="notiList"></div>
</dialog>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let token = null;
try { token = localStorage.getItem('token'); } catch (e) {}
let details = [], filter = 'all', detailId = null, slideIdx = 0, slideTimer, bannerSig = '';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const fmtDate = (s) => { const d = new Date(s); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtShort = (s) => { const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const THEMES = [['#0f7a55', '#0a4a3a', '🎤'], ['#1f6f8b', '#16405c', '🎻'], ['#b5562b', '#6a2c1a', '🎭'], ['#5b6b2a', '#2e3a16', '🎷'], ['#3a4d8f', '#1f2a57', '🎸']];
const theme = (id) => THEMES[id % THEMES.length];
const bg = (id) => `linear-gradient(160deg, ${theme(id)[0]}, ${theme(id)[1]})`;

function parseJwt(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { return null; } }
function me() { const p = token && parseJwt(token); return !p || (p.exp && p.exp * 1000 < Date.now()) ? null : { id: p.sub, role: p.role }; }

let toastTimer;
function toast(msg, isErr) {
  const el = $('#toast'); el.textContent = msg; el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.className = ''), 2800);
}
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(path, { ...opts, headers });
  const text = await res.text();
  if (res.status === 401) throw new Error('로그인이 필요하거나 만료되었습니다.');
  if (res.status === 403) throw new Error('권한이 없습니다.');
  if (!res.ok) throw new Error(text || '요청 실패 (' + res.status + ')');
  try { return text ? JSON.parse(text) : null; } catch (e) { return text; }
}
const act = async (fn, okMsg) => { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); } };

function setToken(t) {
  token = t;
  try { t ? localStorage.setItem('token', t) : localStorage.removeItem('token'); } catch (e) {}
  renderUser(); loadAll();
}
function renderUser() {
  const u = me();
  $('#myCard').classList.toggle('hidden', !u);
  $('#navMy').classList.toggle('hidden', !u);
  const admin = !!(u && u.role === 'ADMIN');
  $('#adminCard').classList.toggle('hidden', !admin);
  $('#demoCard').classList.toggle('hidden', !admin);
  $('#statsCard').classList.toggle('hidden', !admin);
  $('#navDemo').classList.toggle('hidden', !admin);
  $('#navAdmin').classList.toggle('hidden', !admin);
  $('#userbox').innerHTML = u
    ? `<span>회원 #${esc(u.id)}${admin ? ' (관리자)' : ''}</span><button id="btnBell">🔔 알림<span id="nbadge" class="nbadge hidden"></span></button><button id="btnLogout">로그아웃</button>`
    : '<button id="btnLogin">로그인</button><button id="btnJoin">회원가입</button>';
  const f = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  f('#btnLogout', () => setToken(null)); f('#btnLogin', () => openAuth('login')); f('#btnJoin', () => openAuth('signup'));
  f('#btnBell', openNotifications);
  lastUnread = null;
}

/* status of a performance */
function status(d) {
  if (!d.schedules.length) return 'none';
  const now = new Date();
  if (d.schedules.some((s) => new Date(s.ticketOpenAt) <= now && s.remainingStock > 0)) return 'open';
  if (d.schedules.some((s) => new Date(s.ticketOpenAt) > now)) return 'soon';
  return 'sold';
}
const LABEL = { open: '예매 중', soon: '오픈 예정', sold: '매진', none: '준비 중' };
const dateRange = (d) => {
  if (!d.schedules.length) return '일정 미정';
  const a = fmtDate(d.schedules[0].startAt).slice(0, 10), b = fmtDate(d.schedules[d.schedules.length - 1].startAt).slice(0, 10);
  return a === b ? a : `${a} ~ ${b}`;
};

/* banner */
function renderBanner() {
  const picks = details.filter((d) => status(d) === 'open').slice(0, 3);
  const list = picks.length ? picks : details.slice(0, 3);
  const box = $('#banner');
  const sig = list.map((d) => d.id).join(',');
  if (sig === bannerSig) return; // 5초 갱신 때 배너가 처음 슬라이드로 되돌아가지 않도록
  bannerSig = sig;
  clearInterval(slideTimer);
  if (!list.length) { box.innerHTML = '<div style="padding:60px;text-align:center" class="muted">등록된 공연이 없습니다.</div>'; return; }
  box.innerHTML = list.map((d, i) => `
    <div class="slide ${i === 0 ? 'on' : ''}" style="background:${bg(d.id)}">
      <div><div class="kicker">NOW TICKETING</div><h2>${esc(d.title)}</h2>
        <div class="meta">📍 ${esc(d.venue)} &nbsp;·&nbsp; ${dateRange(d)}</div>
        <button data-open="${d.id}">예매하기</button></div>
      <div class="emoji">${theme(d.id)[2]}</div>
    </div>`).join('') + `<div class="dots">${list.map((_, i) => `<i class="${i === 0 ? 'on' : ''}" data-dot="${i}"></i>`).join('')}</div>`;
  slideIdx = 0;
  const go = (n) => {
    slideIdx = n % list.length;
    box.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('on', i === slideIdx));
    box.querySelectorAll('.dots i').forEach((s, i) => s.classList.toggle('on', i === slideIdx));
  };
  box.querySelectorAll('[data-dot]').forEach((el) => (el.onclick = () => go(Number(el.dataset.dot))));
  box.querySelectorAll('[data-open]').forEach((el) => (el.onclick = () => openDetail(Number(el.dataset.open))));
  if (list.length > 1) slideTimer = setInterval(() => go(slideIdx + 1), 5000);
}

/* list */
function renderList() {
  const shown = details.filter((d) => filter === 'all' || status(d) === filter);
  $('#listTitle').textContent = { all: '전체 공연', open: '예매 중인 공연', soon: '오픈 예정 공연', sold: '매진된 공연' }[filter];
  $('#listCount').textContent = `총 ${shown.length}개`;
  $('#performances').innerHTML = shown.length ? shown.map((d) => {
    const st = status(d);
    return `<div class="card" data-open="${d.id}">
      <div class="poster" style="background:${bg(d.id)}"><span class="badge ${st}">${LABEL[st]}</span>
        <span class="emoji">${theme(d.id)[2]}</span><span class="pt">${esc(d.title)}</span></div>
      <div class="info"><div class="t">${esc(d.title)}</div><div class="v">${esc(d.venue)}</div><div class="v">${dateRange(d)}</div></div></div>`;
  }).join('') : '<div class="empty">조건에 맞는 공연이 없습니다.</div>';
  document.querySelectorAll('#performances [data-open]').forEach((el) => (el.onclick = () => openDetail(Number(el.dataset.open))));
}

/* detail dialog */
function renderDetail() {
  const d = details.find((x) => x.id === detailId); if (!d) return;
  const now = new Date();
  $('#detailBody').innerHTML = `
    <div class="dhead">
      <div class="dposter" style="background:${bg(d.id)}">${theme(d.id)[2]}</div>
      <div class="dinfo"><span class="badge ${status(d)}" style="position:static;display:inline-block;margin-bottom:8px">${LABEL[status(d)]}</span>
        <h2>${esc(d.title)}</h2><div class="muted">${esc(d.description)}</div>
        <dl><dt>장소</dt><dd>${esc(d.venue)}</dd><dt>기간</dt><dd>${dateRange(d)}</dd></dl></div>
    </div>
    <div class="dsched"><h3>회차 선택</h3>
      ${d.schedules.map((s) => {
        const open = new Date(s.ticketOpenAt) <= now;
        const pct = Math.round((s.remainingStock / s.totalStock) * 100);
        const cls = s.remainingStock === 0 ? 'out' : (pct <= 20 ? 'low' : '');
        const btn = !open ? `<button class="btn" disabled>${fmtShort(s.ticketOpenAt)} 오픈</button>`
                  : s.remainingStock === 0 ? '<button class="btn" disabled>매진</button>'
                  : `<button class="btn primary" data-reserve="${s.id}">예매하기</button>`;
        return `<div class="sch"><div><div class="d">${fmtDate(s.startAt)}</div><div class="muted">티켓 오픈 ${fmtDate(s.ticketOpenAt)}</div></div>
          <div class="bwrap"><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div><div class="muted">잔여 <b>${s.remainingStock}</b> / ${s.totalStock}석</div></div>${btn}</div>`;
      }).join('') || '<div class="muted">등록된 회차가 없습니다.</div>'}
    </div>`;
  document.querySelectorAll('#detailBody [data-reserve]').forEach((b) => (b.onclick = () => reserve(b.dataset.reserve)));
}
function openDetail(id) { detailId = id; renderDetail(); const dlg = $('#detailDialog'); if (!dlg.open) dlg.showModal(); }
$('#detailClose').onclick = () => $('#detailDialog').close();
$('#detailDialog').onclick = (e) => { if (e.target.id === 'detailDialog') e.target.close(); };

/* data */
async function loadMine() {
  if (!me()) return;
  const rows = await api('/api/reservations');
  $('#myReservations').innerHTML = rows.length
    ? `<table><thead><tr><th>예매번호</th><th>회차</th><th>수량</th><th>상태</th><th>예매일시</th><th></th></tr></thead><tbody>` +
      rows.map((r) => `<tr><td>${r.id}</td><td>#${r.scheduleId}</td><td>${r.quantity}매</td>
        <td class="st-${r.status}">${r.status === 'CONFIRMED' ? '예매 완료' : '취소'}</td><td>${fmtDate(r.createdAt)}</td>
        <td>${r.status === 'CONFIRMED' ? `<button class="btn danger" data-cancel="${r.id}">예매 취소</button>` : ''}</td></tr>`).join('') + '</tbody></table>'
    : '<div class="empty">예매 내역이 없습니다.</div>';
  document.querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = () => cancel(b.dataset.cancel)));
}
async function loadPerformances() {
  const kw = $('#keyword').value.trim();
  // 목록과 회차를 한 번의 요청으로 받는다 (공연마다 상세를 따로 호출하던 N+1 제거)
  const page = await api('/api/performances/with-schedules?size=50' + (kw ? '&keyword=' + encodeURIComponent(kw) : ''));
  details = page.content || [];
  renderBanner(); renderList(); renderMgmt(); if ($('#detailDialog').open) renderDetail();
  $('#sPerf').innerHTML = details.map((d) => `<option value="${d.id}">${esc(d.title)}</option>`).join('');
}
const loadAll = () => act(async () => { await loadPerformances(); await loadMine(); await loadNotifications(); await loadStats(); });

/* admin: dashboard + management */
const isAdmin = () => { const u = me(); return !!(u && u.role === 'ADMIN'); };
async function loadStats() {
  if (!isAdmin()) return;
  const s = await api('/api/admin/stats');
  const rate = s.totalStock ? Math.round((s.sold / s.totalStock) * 100) : 0;
  $('#kpis').innerHTML = [
    ['공연', s.performances + '개', ''], ['회차', s.schedules + '개', ''], ['총 재고', s.totalStock.toLocaleString() + '장', ''],
    ['판매', s.sold.toLocaleString() + '장', 'g'], ['판매율', rate + '%', 'g'],
  ].map(([l, v, c]) => `<div class="kpi"><div class="v ${c}">${v}</div><div class="l">${l}</div></div>`).join('');
  $('#statRows').innerHTML = s.items.length ? s.items.map((p) => {
    const pct = p.totalStock ? Math.round((p.sold / p.totalStock) * 100) : 0;
    return `<div class="stat-row"><div><div class="nm">${esc(p.title)}</div><div class="sub">${esc(p.venue)} · 회차 ${p.schedules.length}개</div></div>
      <div><div class="bar"><i style="width:${pct}%"></i></div><div class="sub">판매 ${p.sold} / ${p.totalStock}장</div></div><div class="num">${pct}%</div></div>`;
  }).join('') : '<div class="empty">등록된 공연이 없습니다.</div>';
}

const toLocalInput = (s) => (s || '').slice(0, 16);
function renderMgmt() {
  if (!isAdmin()) return;
  const box = $('#mgmt');
  if (box.contains(document.activeElement) && document.activeElement !== box) return; // 입력 중에는 덮어쓰지 않는다
  box.innerHTML = details.length ? details.map((d) => `
    <div class="mrow"><div><b>${esc(d.title)}</b> <span class="muted">${esc(d.venue)}</span></div>
      <div class="row"><button class="btn sm" data-edit="${d.id}">수정</button><button class="btn sm danger" data-del="${d.id}">삭제</button></div></div>
    ${d.schedules.map((s) => `<div class="msub">회차 #${s.id} · ${fmtDate(s.startAt)} · 오픈
      <input type="datetime-local" value="${toLocalInput(s.ticketOpenAt)}" data-open-input="${s.id}">
      <button class="btn sm" data-open-save="${s.id}">오픈 시각 변경</button></div>`).join('')}`).join('')
    : '<div class="muted">등록된 공연이 없습니다.</div>';
  box.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => openEdit(Number(b.dataset.edit))));
  box.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => deletePerformance(Number(b.dataset.del))));
  box.querySelectorAll('[data-open-save]').forEach((b) => (b.onclick = () => saveOpenAt(b.dataset.openSave)));
}
let editId = null;
function openEdit(id) {
  const d = details.find((x) => x.id === id); if (!d) return;
  editId = id; $('#eTitle').value = d.title; $('#eVenue').value = d.venue; $('#eDesc').value = d.description || '';
  $('#editDialog').showModal();
}
$('#editCancel').onclick = () => $('#editDialog').close();
$('#editForm').onsubmit = async (e) => {
  e.preventDefault();
  const ok = await act(() => api('/api/admin/performances/' + editId, { method: 'PUT',
    body: JSON.stringify({ title: $('#eTitle').value.trim(), venue: $('#eVenue').value.trim(), description: $('#eDesc').value.trim() }) }), '공연이 수정되었습니다.');
  if (ok !== undefined) { $('#editDialog').close(); loadAll(); }
};
async function deletePerformance(id) {
  const d = details.find((x) => x.id === id);
  if (!confirm(`'${d ? d.title : id}' 공연과 모든 회차를 삭제할까요?\n(이미 예매된 내역은 남습니다)`)) return;
  await act(() => api('/api/admin/performances/' + id, { method: 'DELETE' }), '공연이 삭제되었습니다.');
  loadAll();
}
async function saveOpenAt(scheduleId) {
  const input = document.querySelector(`[data-open-input="${scheduleId}"]`);
  if (!input.value) return toast('오픈 시각을 입력하세요.', true);
  const v = input.value.length === 16 ? input.value + ':00' : input.value;
  await act(() => api('/api/admin/schedules/' + scheduleId + '/ticket-open-at', { method: 'PATCH', body: JSON.stringify({ ticketOpenAt: v }) }), '티켓 오픈 시각이 변경되었습니다.');
  loadAll();
}
$('#navAdmin').onclick = () => $('#statsCard').scrollIntoView({ behavior: 'smooth' });

/* notifications */
let lastUnread = null, notiItems = [];
async function loadNotifications() {
  if (!me()) return;
  const r = await api('/api/notifications');
  notiItems = r.items;
  const badge = $('#nbadge');
  if (badge) { badge.textContent = r.unreadCount; badge.classList.toggle('hidden', r.unreadCount === 0); }
  if (lastUnread !== null && r.unreadCount > lastUnread) toast('🔔 ' + r.items[0].message);
  lastUnread = r.unreadCount;
  if ($('#notiDialog').open) renderNotifications();
}
function renderNotifications() {
  $('#notiList').innerHTML = notiItems.length
    ? notiItems.map((n) => `<div class="noti ${n.read ? '' : 'unread'}"><div class="m">${esc(n.message)}<div class="t">${fmtDate(n.createdAt)}</div></div></div>`).join('')
    : '<div class="empty" style="margin-top:12px">새로운 알림이 없습니다.</div>';
}
function openNotifications() { renderNotifications(); const d = $('#notiDialog'); if (!d.open) d.showModal(); }
$('#notiClose').onclick = () => $('#notiDialog').close();
$('#btnReadAll').onclick = async () => { await act(() => api('/api/notifications/read-all', { method: 'POST' })); lastUnread = null; loadNotifications(); };

/* concurrency demo */
const DEMO = [['none', '락 없음'], ['pessimistic', '비관적 락'], ['optimistic', '낙관적 락']];
$('#navDemo').onclick = () => $('#demoCard').scrollIntoView({ behavior: 'smooth' });
$('#btnDemo').onclick = async () => {
  const stock = Number($('#dStock').value), requests = Number($('#dReq').value);
  const results = [], btn = $('#btnDemo');
  btn.disabled = true;
  const draw = (running) => {
    const max = Math.max(requests, 1);
    $('#demoResults').innerHTML = results.map((r) => {
      const bad = r.oversold > 0;
      const w = Math.min(100, (r.confirmed / Math.max(r.confirmed, stock)) * 100), lim = (stock / Math.max(r.confirmed, stock)) * 100;
      return `<div class="res"><div class="nm">${r.label}</div>
        <div><div class="track"><div class="fill ${bad ? 'bad' : ''}" style="width:${w}%"></div><div class="limit" style="left:${lim}%"></div></div>
          <div class="sub">확정 예매 ${r.confirmed}건 / 재고 ${r.stock}장 · 성공 응답 ${r.success}건${r.retries ? ' · 재시도 ' + r.retries + '회' : ''} · ${r.elapsedMillis}ms</div></div>
        <div class="verdict ${bad ? 'bad' : 'ok'}">${bad ? '초과 판매 ' + r.oversold + '건' : '정합성 OK'}</div></div>`;
    }).join('') + (running ? `<div class="res"><div class="nm">${running}</div><div class="muted">실행 중…</div><div></div></div>` : '');
  };
  for (const [key, label] of DEMO) {
    draw(label);
    const r = await act(() => api('/api/admin/demo/concurrency', { method: 'POST', body: JSON.stringify({ strategy: key, stock, requests }) }));
    if (!r) break;
    results.push({ ...r, label });
  }
  draw(null); btn.disabled = false;
};

async function reserve(scheduleId) {
  if (!me()) { toast('로그인 후 예매할 수 있습니다.', true); $('#detailDialog').close(); return openAuth('login'); }
  await act(() => api('/api/reservations', { method: 'POST', body: JSON.stringify({ scheduleId: Number(scheduleId), quantity: 1 }) }), '예매가 완료되었습니다.');
  loadAll();
}
async function cancel(id) {
  await act(() => api('/api/reservations/' + id, { method: 'DELETE' }), '예매가 취소되었습니다.');
  loadAll();
}

/* auth */
let mode = 'login';
function openAuth(m) {
  mode = m;
  $('#tabLogin').classList.toggle('on', m === 'login'); $('#tabSignup').classList.toggle('on', m === 'signup');
  $('#name').classList.toggle('hidden', m === 'login'); $('#name').required = m === 'signup';
  $('#authSubmit').textContent = m === 'login' ? '로그인' : '가입하기';
  const d = $('#authDialog'); if (!d.open) d.showModal();
}
$('#tabLogin').onclick = () => openAuth('login');
$('#tabSignup').onclick = () => openAuth('signup');
$('#authCancel').onclick = () => $('#authDialog').close();
$('#authForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim(), password = $('#password').value;
  if (mode === 'signup') {
    const ok = await act(() => api('/api/auth/signup', { method: 'POST', body: JSON.stringify({ email, password, name: $('#name').value.trim() }) }), '가입되었습니다. 로그인해 주세요.');
    if (ok !== undefined) openAuth('login');
    return;
  }
  const r = await act(() => api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) }), '로그인되었습니다.');
  if (r && r.accessToken) { $('#authDialog').close(); $('#password').value = ''; setToken(r.accessToken); }
};

/* nav / search / admin */
document.querySelectorAll('.gnb [data-filter]').forEach((a) => (a.onclick = () => {
  filter = a.dataset.filter;
  document.querySelectorAll('.gnb [data-filter]').forEach((x) => x.classList.toggle('on', x === a));
  renderList();
}));
$('#navMy').onclick = () => $('#myCard').scrollIntoView({ behavior: 'smooth' });
$('#btnSearch').onclick = loadAll;
$('#keyword').onkeydown = (e) => { if (e.key === 'Enter') loadAll(); };

const sec = (v) => (v.length === 16 ? v + ':00' : v);
$('#btnAddPerf').onclick = async () => {
  await act(() => api('/api/admin/performances', { method: 'POST',
    body: JSON.stringify({ title: $('#pTitle').value.trim(), venue: $('#pVenue').value.trim(), description: $('#pDesc').value.trim() }) }), '공연이 등록되었습니다.');
  loadAll();
};
$('#btnAddSched').onclick = async () => {
  const id = $('#sPerf').value;
  if (!id) return toast('먼저 공연을 등록하세요.', true);
  await act(() => api('/api/admin/performances/' + id + '/schedules', { method: 'POST',
    body: JSON.stringify({ startAt: sec($('#sStart').value), ticketOpenAt: sec($('#sOpen').value), totalStock: Number($('#sStock').value) }) }), '회차가 등록되었습니다.');
  loadAll();
};

renderUser(); loadAll();
// 시연 중에는 임시 공연이 목록에 비치지 않도록 갱신을 멈춘다.
setInterval(() => { if (!document.hidden && !$('#authDialog').open && !$('#btnDemo').disabled) loadAll(); }, 5000);
</script>
</body>
</html>
